<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Tunet Camper 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Saira+Condensed:wght@600;700;800&display=swap">
<style>
body{margin:0}

/* Layout: navy kampprogram-band med gul stripe, faktastripe, deretter to kolonner (program + øktfordeling | oppgaver + spørsmål) */
:root{
  --navy:#0F2C66; --yellow:#FFC72C; --yellow-ink:#0F2C66;
  --bg:#F3F5FA; --surface:#FFFFFF; --ink:#0E1A33; --muted:#56637F; --line:#DAE0EC; --soft:#E9EEF7;
  --band:#0F2C66; --on-band:#FFFFFF; --on-band-muted:#B9C6E4;
  --accent:#0F2C66; --focus:#2A62D6;
  --g1-bg:#0F2C66; --g1-fg:#FFFFFF; --g2-bg:#FFC72C; --g2-fg:#0F2C66; --g3-bg:#CFDDFA; --g3-fg:#0F2C66;
  --ok:#1E7F47; --ok-bg:#E2F3E9; --warn:#9A6200; --warn-bg:#FFF2CC; --bad:#B3261E; --bad-bg:#FBE4E2;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08122B; --surface:#0F1D40; --ink:#E9EFFC; --muted:#9DAACA; --line:#22335E; --soft:#16264F;
  --band:#0B1D47; --on-band:#FFFFFF; --on-band-muted:#9FB1DA; --accent:#FFC72C; --focus:#8FB2FF;
  --g1-bg:#3D63B8; --g1-fg:#FFFFFF; --g3-bg:#2A3F6E; --g3-fg:#E9EFFC;
  --ok:#6FD39B; --ok-bg:#12352A; --warn:#F2C25B; --warn-bg:#3A2F10; --bad:#FF8A80; --bad-bg:#3E1A1A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08122B; --surface:#0F1D40; --ink:#E9EFFC; --muted:#9DAACA; --line:#22335E; --soft:#16264F;
  --band:#0B1D47; --on-band:#FFFFFF; --on-band-muted:#9FB1DA; --accent:#FFC72C; --focus:#8FB2FF;
  --g1-bg:#3D63B8; --g1-fg:#FFFFFF; --g3-bg:#2A3F6E; --g3-fg:#E9EFFC;
  --ok:#6FD39B; --ok-bg:#12352A; --warn:#F2C25B; --warn-bg:#3A2F10; --bad:#FF8A80; --bad-bg:#3E1A1A;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.05}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* band */
.band{background:var(--band);color:var(--on-band);border-bottom:6px solid var(--yellow)}
.band .wrap{padding-block:28px 24px;display:grid;gap:18px}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-family:var(--f-display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--yellow)}
.band h1{font-size:clamp(40px,7vw,68px);font-weight:800;letter-spacing:.01em;text-transform:uppercase}
.band h1 span{color:var(--yellow)}
.count{display:flex;align-items:baseline;gap:8px;background:var(--yellow);color:var(--yellow-ink);padding:8px 16px;border-radius:4px}
.count b{font-family:var(--f-display);font-size:40px;font-weight:800;line-height:1}
.count small{font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.14);border-radius:6px;overflow:hidden}
.fact{background:var(--band);padding:10px 14px;min-width:0}
.fact .k{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--on-band-muted);font-weight:600}
.fact .v{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.band input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:var(--on-band);border-radius:4px;padding:3px 6px;width:100%}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-block:14px}
.status{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 14px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}
.btn.small{padding:3px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}

/* grid */
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;padding-bottom:40px}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:grid;gap:20px;align-content:start;min-width:0}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;min-width:0}
.card h2{font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.card h2 .meta{font-family:var(--f-body);font-size:13px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted)}
.card > p.lead{color:var(--muted);margin:6px 0 14px;font-size:14px;max-width:65ch}

/* program */
.prog{list-style:none;margin:12px 0 0;padding:0;display:grid}
.prog li{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.prog li:first-child{border-top:0}
.prog .t{font-weight:600;color:var(--muted)}
.prog li.okt .n{font-family:var(--f-display);font-weight:700;font-size:20px}
.prog li.okt .t{color:var(--ink)}
.prog li.pause .n{color:var(--muted)}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.okt{background:var(--yellow);color:var(--yellow-ink)}
.prog .edit-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.prog input.time{width:70px}
@media (max-width:480px){.prog li{grid-template-columns:90px minmax(0,1fr)}.prog li .tag{display:none}}

/* rotation */
.rot-wrap{overflow-x:auto;margin-top:12px}
table.rot{border-collapse:separate;border-spacing:6px;width:100%;min-width:560px;margin:-6px}
.rot td{vertical-align:top}
.rot th{font-family:var(--f-display);font-weight:700;font-size:16px;text-transform:uppercase;text-align:left;padding:2px 4px;color:var(--muted)}
.rot th.row{white-space:nowrap}
.rot th.row b{display:block;color:var(--ink);font-size:20px}
.rot th.row small{font-family:var(--f-body);font-weight:500;font-size:12px;text-transform:none}
.cell{border-radius:6px;padding:10px 12px;min-height:62px;display:grid;gap:2px;align-content:center;position:relative;overflow:hidden}
.cell .g{font-weight:700;font-size:15px}
.cell .a{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;opacity:.85}
.cell.fys{background-image:repeating-linear-gradient(135deg,transparent 0 8px,rgba(255,255,255,.14) 8px 16px)}
.g1{background:var(--g1-bg);color:var(--g1-fg)} .g2{background:var(--g2-bg);color:var(--g2-fg)} .g3{background:var(--g3-bg);color:var(--g3-fg)}
.g0{background:var(--soft);color:var(--muted)}
.card .cell select{width:100%;background:#FFFFFF;color:#0E1A33;border:0;border-radius:4px;padding:3px 4px;font-size:13px;color-scheme:light}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.check{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;display:inline-flex;gap:6px;align-items:center}
.check.ok{background:var(--ok-bg);color:var(--ok)} .check.bad{background:var(--bad-bg);color:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px;background:var(--g1-bg)}
.sw.fys{background-image:repeating-linear-gradient(135deg,transparent 0 3px,rgba(255,255,255,.45) 3px 6px)}

/* groups */
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-top:12px}
.group{border:1px solid var(--line);border-radius:8px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;min-width:0}
.group header{padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.group header h3{font-size:22px;font-weight:800}
.group header span{font-size:13px;font-weight:600;opacity:.9}
.group .body{padding:12px 14px;display:grid;gap:8px;align-content:start}
.bar{height:8px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.kv span{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.note.flag{color:var(--warn);background:var(--warn-bg);padding:6px 8px;border-radius:4px}
.inline-num{width:64px}
.keeper{margin-top:12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:12px 14px;border:1px dashed var(--line);border-radius:8px}
.keeper .big{font-family:var(--f-display);font-weight:800;font-size:38px;line-height:1}

/* tasks */
.tasks{list-style:none;margin:12px 0 0;padding:0;display:grid}
.tasks li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.tasks li:first-child{border-top:0}
.tasks input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--navy)}
.tasks .txt{min-width:0;overflow-wrap:anywhere}
.tasks li.done .txt{text-decoration:line-through;color:var(--muted)}
.who{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;font-size:12px}
.who .tag.person{background:var(--soft);color:var(--ink);text-transform:none;letter-spacing:0;font-weight:600}
.who .tag.none{background:var(--warn-bg);color:var(--warn);text-transform:none;letter-spacing:0}
.progress{display:flex;align-items:center;gap:10px;margin-top:10px}
.progress .bar{flex:1}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.addrow input{flex:1 1 180px;min-width:0}

/* inputs */
.card input[type=text],.card input[type=number],.card input[type=date],.card textarea,.card select{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:5px 8px;min-width:0}
.card textarea{width:100%;min-height:110px;resize:vertical}
.notes{white-space:pre-wrap;margin-top:10px;max-width:65ch}

/* questions */
.qs{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.qs li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 12px;border-radius:6px;background:var(--warn-bg)}
.qs li.solved{background:var(--soft)}
.qs li .mark{font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--warn);line-height:1.2}
.qs li.solved .mark{color:var(--ok)}
.qs li.solved .txt{color:var(--muted)}
.qs .txt{min-width:0;overflow-wrap:anywhere}
.qs .ans{font-size:13px;color:var(--muted);margin-top:2px}

/* section edit + new bits */
.card h2 .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prog.editing li{grid-template-columns:auto minmax(0,1fr) auto}
.prog.editing .edit-row input[type=text]{flex:1 1 140px}
.prog input.time{width:auto}
@media (max-width:480px){.prog.editing li{grid-template-columns:minmax(0,1fr)}}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper .btn{width:30px;padding:3px 0;font-size:16px;line-height:1}
.stepper input{width:56px;text-align:center}
.fill{display:flex;align-items:center;gap:8px}
.fill .bar{flex:1}
.bar.full i{background:var(--ok)}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.open{background:var(--soft);color:var(--muted)}
.pill.full{background:var(--ok-bg);color:var(--ok)}
.note-add{display:grid;gap:8px;margin-top:12px;justify-items:start}
.card .note-add textarea{min-height:70px}
.notelist{list-style:none;margin:12px 0 0;padding:0;display:grid}
.notelist li{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.notelist li:first-child{border-top:0}
.notelist .notes{margin-top:0}
.note-act{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.note-act span{display:inline-flex;gap:4px}

/* groups as rows */
.groups{grid-template-columns:minmax(0,1fr)!important}
.group .body{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 20px;align-items:center}
.group .body .note,.group .body textarea{grid-column:1/-1}
.group header{flex-wrap:wrap}
.kv{flex-wrap:wrap;align-items:center}
.prog input.time{width:68px;text-align:center}
/* tasks */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.filters select,.filters input{flex:1 1 140px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--navy);color:#fff}
.seg button span{opacity:.7;margin-left:2px}
.card .filters input[type=search]{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:5px 8px}
.who{align-items:center}
.added{color:var(--muted);font-size:12px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.tasks .ttl{display:block}
.tact{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.tedit{display:grid;gap:8px}
.tedit label{display:grid;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tedit label input{font-size:14px;font-weight:400;color:var(--ink)}
.trow{display:flex;gap:8px;flex-wrap:wrap}
.trow label{flex:1 1 140px}
.comments{margin-top:8px;padding:8px 10px;border-left:3px solid var(--yellow);background:var(--bg);border-radius:0 6px 6px 0;display:grid;gap:8px}
.cmt{display:grid;gap:2px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.cmt .notes{font-size:14px}
.cadd{display:flex;gap:6px;flex-wrap:wrap}
.cadd input{flex:1 1 160px}
.task-add input{flex:1 1 120px}
.task-add #new-task{flex:3 1 180px}

/* facts edit + trainers */
.factbar{display:flex;justify-content:flex-end}
.btn.onband{background:transparent;color:var(--on-band);border-color:rgba(255,255,255,.4)}
.btn.onband:hover{border-color:var(--yellow);color:var(--yellow)}
.band input{color-scheme:dark}
.fact .unset{color:var(--on-band-muted);font-weight:500}
.trn{margin-top:6px;padding:6px 8px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);display:grid;gap:4px}
.trn-h{display:flex;justify-content:space-between;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tline{font-size:13px;font-weight:500;border-bottom:1px solid var(--line);padding:2px 0;min-height:22px;overflow-wrap:anywhere}
.tline.empty{border-bottom-style:dashed}
.trn input{width:100%;font-size:13px;padding:3px 6px;background:var(--bg);border:1px solid var(--line);border-radius:4px;min-width:0}

/* multi-day */
.when-edit{display:grid;gap:6px}
.when-n,.when-d{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px;align-items:center;font-size:12px;font-weight:600;color:var(--on-band-muted)}
.when-n input{width:60px}
.facts:has(.when-edit) .fact:first-child{grid-column:span 2}
.when-d input{min-width:140px}
.when-line{display:block}
.when-sub{display:block;font-size:12px;font-weight:500;color:var(--on-band-muted)}

/* save bar */
.savebar{position:sticky;bottom:0;background:var(--band);color:var(--on-band);border-top:4px solid var(--yellow);padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:10px}
.savebar .btn{background:transparent;color:var(--on-band);border-color:rgba(255,255,255,.35)}
.savebar .btn.primary{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
footer.foot{color:var(--muted);font-size:12px;padding-bottom:28px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* live: save status, who is online, toast, footer */
.status{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.savechip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--ok-bg);color:var(--ok);white-space:nowrap}
.savechip.pending,.savechip.saving{background:var(--soft);color:var(--muted)}
.savechip.error{background:var(--bad-bg);color:var(--bad)}
.online{display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.who-on{background:var(--soft);color:var(--ink);font-weight:600;padding:2px 8px;border-radius:999px}
.who-on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px}
.hint{font-size:13px;color:var(--muted);flex-basis:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--band);color:var(--on-band);border-left:4px solid var(--yellow);padding:10px 16px;border-radius:6px;font-weight:600;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:10;max-width:calc(100% - 32px)}
footer.foot{display:flex;flex-wrap:wrap;gap:10px 20px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:16px;margin-top:8px}
.foot-user{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.foot-user .btn{font-size:14px;padding:6px 16px}

/* site: auth + account */
.auth{max-width:440px;margin:32px auto 48px;display:grid;gap:12px}
.auth,.acct{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px}
.auth h2{font-size:28px;text-transform:uppercase}
.authform{display:grid;gap:12px}
.authform label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.card .authform input{font-size:16px;padding:9px 10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--ink)}
.authform .btn{justify-self:start;padding:9px 18px}
.auth .msg{color:var(--warn)}
.band h1 span{color:var(--yellow)}
.acct{display:grid;gap:10px;margin-bottom:16px;max-width:520px;margin-left:auto}
#login-code{font-size:24px!important;letter-spacing:.3em;font-variant-numeric:tabular-nums}
</style>
</head>

  var pendingEmail='';
  try{pendingEmail=localStorage.getItem('tunet-camper-email')||''}catch(x){}
  async function sendCode(resend){
    var em=resend?pendingEmail:((document.getElementById('login-email')||{}).value||'');
    em=em.trim().toLowerCase();
    if(!em){authMsg='Skriv inn e-postadressen din.';render();return}
    authBusy=true;authMsg='';pendingEmail=em;render();
    try{localStorage.setItem('tunet-camper-email',em)}catch(x){}
    var ok=await sb.rpc('camp_login_allowed',{p_email:em});
    if(ok.error){authBusy=false;authMsg='Fikk ikke kontakt med serveren. Prøv igjen.';render();return}
    if(!ok.data){authBusy=false;authMsg='Denne e-postadressen har ikke tilgang. Be Sverre om å legge deg til.';render();return}
    var r=await sb.auth.signInWithOtp({email:em,options:{shouldCreateUser:true}});
    authBusy=false;
    if(r.error){
      authMsg=/email rate limit|over_email/i.test(r.error.message+' '+(r.error.code||''))?'Grensen for antall e-poster per time er nådd, så det ble ikke sendt noen kode. Prøv igjen om en stund (opptil en time). Har du en kode fra før som ikke er brukt, kan du bruke den.':/rate|limit|seconds/i.test(r.error.message)?'Du har nettopp bedt om en kode. Vent ett minutt før du ber om en ny.':(/signup|not allowed/i.test(r.error.message)?'Kontoen din er ikke opprettet ennå. Be Sverre om å opprette den i Supabase.':'Kunne ikke sende kode: '+r.error.message);
      if(resend){screen='code'}render();return;
    }
    try{localStorage.setItem('tunet-camper-code-sent',String(Date.now()))}catch(x){}
    screen='code';authMsg=resend?'Ny kode er sendt.':'';render();
    var c=document.getElementById('login-code');if(c)c.focus();
  }
  async function verifyCode(){
    var code=((document.getElementById('login-code')||{}).value||'').replace(/\D/g,'');
    if(code.length<6){authMsg='Koden har minst 6 siffer.';render();return}
    authBusy=true;authMsg='';render();
    var r=await sb.auth.verifyOtp({email:pendingEmail,token:code,type:'email'});
    authBusy=false;
    if(r.error){authMsg=/expired|invalid/i.test(r.error.message)?'Koden er feil eller utløpt. Prøv igjen, eller be om en ny kode.':'Innloggingen feilet: '+r.error.message;render();return}
    session=r.data.session;await boot();
  }
  async function logout(){
    if(state&&saved&&dirty()){clearTimeout(saveTimer);await save()}
    try{if(channel)channel.untrack()}catch(x){}
    try{if(channel)sb.removeChannel(channel)}catch(x){}
    channel=null;await sb.auth.signOut();
    session=null;saved=null;state=null;screen='login';authMsg='';acctOpen=false;render();
  }

  // ---------- data ----------
  async function boot(){
    var s=await sb.auth.getSession();session=s.data.session;
    if(!session){
      var sentAt=0;try{sentAt=+localStorage.getItem('tunet-camper-code-sent')||0}catch(x){}
      screen=(pendingEmail&&Date.now()-sentAt<3600000)?'code':'login';render();return;
    }
    try{localStorage.removeItem('tunet-camper-code-sent')}catch(x){}
    userEmail=(session.user.email||'').toLowerCase();
    screen='loading';render();
    var mem=await sb.from('camp_members').select('email,navn');
    if(mem.error){screen='error';loadErr=mem.error.message;render();return}
    members={};(mem.data||[]).forEach(function(m){members[m.email]=m});
    if(!members[userEmail]){screen='denied';render();return}
    var res=await sb.from('camp_sections').select('key,data,version,updated_at,updated_by');
    if(res.error){screen='error';loadErr=res.error.message;render();return}
    var s0={};versions={};rowInfo={};
    (res.data||[]).forEach(function(r){s0[r.key]=r.data;versions[r.key]=r.version;rowInfo[r.key]={updated_at:r.updated_at,updated_by:r.updated_by}});
    KEYS.forEach(function(k){if(s0[k]===undefined){s0[k]=defaults(k);versions[k]=0}});
    saved=migrate(s0);state=clone(saved);
    canEdit=true;screen='app';msg='';render();
    subscribe();
  }

  function onlineHtml(){
    var names={};online.forEach(function(e){names[e]=1});
    var list=Object.keys(names).map(function(e){return '<span class="who-on'+(e===userEmail?' me':'')+'">'+esc(memberName(e))+(e===userEmail?' (deg)':'')+'</span>'});
    return '<span class="online">'+(list.length?'På nett: '+list.join(''):'')+'</span>';
  }
  function showToast(t){toastMsg=t;var el=document.getElementById('toast');if(el){el.textContent=t;el.hidden=false}clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastMsg='';var e2=document.getElementById('toast');if(e2)e2.hidden=true},4000)}

  // Three-way merge: keeps both people's changes where possible.
  function same(a,b){return JSON.stringify(a)===JSON.stringify(b)}
  function isObj(x){return !!x&&typeof x==='object'&&!Array.isArray(x)}
  function hasIds(a){return Array.isArray(a)&&a.every(function(x){return isObj(x)&&x.id!=null})}
  function merge3(base,mine,theirs){
    if(same(mine,base))return theirs===undefined?undefined:clone(theirs);
    if(same(theirs,base)||same(mine,theirs))return mine===undefined?undefined:clone(mine);
    if(Array.isArray(base)&&Array.isArray(mine)&&Array.isArray(theirs)){
      if(hasIds(base)&&hasIds(mine)&&hasIds(theirs))return mergeById(base,mine,theirs);
      if(base.length===mine.length&&mine.length===theirs.length)return mine.map(function(m,i){return merge3(base[i],m,theirs[i])});
      return clone(mine);
    }
    if(isObj(base)&&isObj(mine)&&isObj(theirs)){
      var out={},keys={};[base,mine,theirs].forEach(function(o){Object.keys(o).forEach(function(k){keys[k]=1})});
      Object.keys(keys).forEach(function(k){var v=merge3(base[k],mine[k],theirs[k]);if(v!==undefined)out[k]=v});
      return out;
    }
    return mine===undefined?undefined:clone(mine);
  }
  function mergeById(base,mine,theirs){
    function map(a){var m={};a.forEach(function(x){m[x.id]=x});return m}
    var B=map(base),M=map(mine),T=map(theirs),out=[];
    theirs.forEach(function(t){
      var id=t.id;
      if(M[id])out.push(B[id]?merge3(B[id],M[id],t):clone(M[id]));
      else if(!B[id])out.push(clone(t));               // added by them
      else if(!same(t,B[id]))out.push(clone(t));        // I deleted it while they changed it: keep it
    });
    mine.forEach(function(m,i){
      if(B[m.id]||T[m.id])return;                       // only items I added
      if(i===0)out.unshift(clone(m));else out.push(clone(m));
    });
    return out;
  }

  function scheduleSave(){
    if(!state||!saved||screen!=='app')return;
    if(!dirty()){if(saveState==='pending'){saveState='saved';updateChip()}return}
    if(saveState!=='saving'){saveState='pending';updateChip()}
    clearTimeout(saveTimer);saveTimer=setTimeout(save,700);
  }
  async function save(){
    if(!state)return;
    if(saving){saveAgain=true;return}
    var changed=KEYS.filter(function(k){return !same(state[k],saved[k])});
    if(!changed.length){saveState='saved';updateChip();return}
    saving=true;saveState='saving';updateChip();
    var failed=false,merged=false;
    for(var i=0;i<changed.length;i++){
      var k=changed[i];
      for(var attempt=0;attempt<3;attempt++){
        var v=versions[k]||0, data=clone(state[k]), r;
        try{
          if(v===0)r=await sb.from('camp_sections').insert({key:k,data:data,version:1}).select('version,updated_at,updated_by');
          else r=await sb.from('camp_sections').update({data:data,version:v+1}).eq('key',k).eq('version',v).select('version,updated_at,updated_by');
        }catch(e){r={error:e}}
        if(r.error&&v!==0){failed=true;break}
        if(!r.error&&r.data&&r.data.length){
          if((versions[k]||0)<=r.data[0].version){saved[k]=data;versions[k]=r.data[0].version;rowInfo[k]={updated_at:r.data[0].updated_at,updated_by:r.data[0].updated_by}}
          break;
        }
        // Someone else saved first: merge their version with mine and try again.
        var cur=await sb.from('camp_sections').select('data,version,updated_at,updated_by').eq('key',k).single();
        if(cur.error||!cur.data){failed=true;break}
        state[k]=merge3(saved[k],state[k],cur.data.data);
        saved[k]=cur.data.data;versions[k]=cur.data.version;rowInfo[k]={updated_at:cur.data.updated_at,updated_by:cur.data.updated_by};
        merged=true;
      }
    }
    saving=false;
    saveState=failed?'error':(dirty()?'pending':'saved');
    if(merged)render();else updateChip();
    if(failed){clearTimeout(saveTimer);saveTimer=setTimeout(save,5000);return}
    if(saveAgain||dirty()){saveAgain=false;clearTimeout(saveTimer);saveTimer=setTimeout(save,300)}
  }

  function applyRemote(r){
    if(!r||!r.key||KEYS.indexOf(r.key)<0||!saved)return false;
    if((versions[r.key]||0)>=r.version)return false;
    var k=r.key;
    state[k]=same(state[k],saved[k])?clone(r.data):merge3(saved[k],state[k],r.data);
    saved[k]=r.data;versions[k]=r.version;rowInfo[k]={updated_at:r.updated_at,updated_by:r.updated_by};
    migrate(saved);migrate(state);
    return true;
  }
  function subscribe(){
    if(channel)return;
    channel=sb.channel('camp-sections',{config:{presence:{key:userEmail}}});
    channel.on('postgres_changes',{event:'*',schema:'public',table:'camp_sections'},function(p){
      var r=p.new;
      if(!applyRemote(r))return;
      if(r.updated_by&&r.updated_by!==userEmail)showToast(memberName(r.updated_by)+' endret «'+LABEL[r.key]+'»');
      render();
    });
    channel.on('presence',{event:'sync'},function(){
      online=Object.keys(channel.presenceState());
      var el=document.querySelector('.online');
      if(el)el.outerHTML=onlineHtml();
    });
    channel.subscribe(function(status){
      if(status==='SUBSCRIBED'){try{channel.track({email:userEmail,at:Date.now()})}catch(x){}}
      if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){
        showToast('Mistet sanntidsforbindelsen. Kobler til på nytt …');
        setTimeout(function(){try{sb.removeChannel(channel)}catch(x){}channel=null;resync()},3000);
      }
    });
  }
  async function resync(){
    if(screen!=='app'||!saved)return;
    var res=await sb.from('camp_sections').select('key,data,version,updated_at,updated_by');
    if(!res.error&&res.data){var any=false;res.data.forEach(function(r){if(applyRemote(r))any=true});if(any)render();scheduleSave()}
    subscribe();
  }
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&screen==='app'&&state)resync()});

  window.addEventListener('beforeunload',function(e){if(state&&saved&&(dirty()||saving)){e.preventDefault();e.returnValue=''}});
  sb.auth.onAuthStateChange(function(evt,sess){
    if(evt==='SIGNED_OUT'&&screen==='app'){screen='login';render()}
  });
  render();
  boot().catch(function(e){screen='error';loadErr=String(e&&e.message||e);render()});
})();
</script>
